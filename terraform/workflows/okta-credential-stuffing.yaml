version: '1'
name: Okta Credential Stuffing Response
enabled: true
description: >-
  Triggered by the Okta credential stuffing detection rule. The case-writer Agent
  Builder agent creates the Security Case (in-progress, alert attached, attacker IP and
  compromised account pinned as observables, analysis comment added). The workflow then
  locates the enrolled Windows endpoint via Fleet, runs the remediate-okta-compromise
  runscript against it, adds a remediation comment and closes the case.

triggers:
  - type: alert

# A const, not an input: alert-triggered runs receive no inputs, so an input
# default is never applied and the remediate step got an empty scriptId.
consts:
  script_id: "REPLACE_WITH_SCRIPT_LIBRARY_UUID"

steps:
  # ============================================================================
  # STEP 1: Hand the alert to the case-writer Agent Builder agent
  #
  # The agent creates the case (tags, severity, syncAlerts: false), marks it
  # in-progress, attaches the alert, pins the attacker IP and compromised
  # account as observables, and adds the analysis comment, using its Cases
  # tools. It returns the case ID for the remaining steps.
  #
  # syncAlerts is false so closing the case does not close the alert: a closed
  # alert is ignored by rule alert suppression, so the rule would raise a new
  # alert (and re-run this workflow) every interval while the seed data is in
  # the lookback.
  # ============================================================================
  - name: write_case
    type: ai.agent
    agent-id: case-writer
    with:
      message: |
        Write the case for this Okta credential stuffing / account takeover alert.

        Case requirements:
        - Title: "Okta Account Takeover: <okta.actor.alternate_id>"
        - Severity: critical
        - Tags: okta, credential-stuffing, account-takeover, T1110.004, T1078, T1098, automated
        - Detection logic: the same user and source IP completed a four-stage chain -
          failed logins (INVALID_CREDENTIALS), then MFA failures, then a successful
          login, then a post-compromise action (privilege grant or policy update).
        - Observables: okta.client.ip as the attacker IPv4 (credential stuffing source),
          okta.actor.alternate_id as the compromised account email.
        - Supporting logs, if you want to query them: logs-okta.system-default, grouped
          by okta.actor.alternate_id and okta.client.ip.
        - Automated remediation (Windows Firewall block of the IP and disabling the
          matching local account) runs after you finish.

        Alert document(s):
        {{ event.alerts | json }}

        Attack stage counts:
        - Failed logins (INVALID_CREDENTIALS): {{ event.alerts[0].failed_login_count | default: 'unknown' }}
        - MFA failures: {{ event.alerts[0].mfa_failure_count | default: 'unknown' }}
        - Successful logins: {{ event.alerts[0].successful_login_count | default: 'unknown' }}
        - Post-compromise events: {{ event.alerts[0].post_compromise_count | default: 'unknown' }}
      schema:
        type: object
        properties:
          case_id:
            type: string
            description: The UUID of the case that was created
        required:
          - case_id

  # ============================================================================
  # STEP 2: Resolve the Fleet agent ID for the enrolled Windows endpoint
  #
  # Finds the first online Fleet agent. In this demo there is one enrolled
  # endpoint (secdemo-vm).
  # ============================================================================
  - name: find_agent
    type: kibana.request
    with:
      method: GET
      path: '/api/fleet/agents?perPage=1&kuery=status%3Aonline'

  # ============================================================================
  # STEP 3: Run the remediation script against the resolved endpoint
  # ============================================================================
  - name: remediate
    type: kibana.request
    with:
      method: POST
      path: /api/endpoint/action/run_script
      body:
        alert_ids:
          - "{{ event.alerts[0]._id }}"
        agent_type: endpoint
        endpoint_ids:
          - "{{ steps.find_agent.output.items[0].id | default: '' }}"
        parameters:
          scriptId: "{{ consts.script_id }}"
          scriptInput: "-SourceIP {{ event.alerts[0].okta.client.ip }} -CompromisedUser {{ event.alerts[0].okta.actor.alternate_id }}"
        comment: "Triggered by workflow '{{ workflow.name }}'"

  # ============================================================================
  # STEP 4: Remediation summary comment
  # ============================================================================
  - name: remediation_comment
    type: cases.addComment
    with:
      case_id: "{{ steps.write_case.output.structured_output.case_id }}"
      comment: |
        ## Automated Remediation Complete

        `remediate-okta-compromise.ps1` ran against the enrolled Windows endpoint:

        - Blocked `{{ event.alerts[0].okta.client.ip }}` at the Windows Firewall
        - Disabled local account `{{ event.alerts[0].okta.actor.alternate_id | split: '@' | first }}`

        Script output:
        ```
        {{ steps.remediate.output | default: 'No output captured' }}
        ```

  # ============================================================================
  # STEP 5: Close the case — remediation complete
  # ============================================================================
  - name: close_case
    type: cases.setStatus
    with:
      case_id: "{{ steps.write_case.output.structured_output.case_id }}"
      status: closed
